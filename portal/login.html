<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAS Mission Control — Login</title>
  <link rel="stylesheet" href="/portal/css/portal.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .login-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .login-header h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 600;
      color: #38bdf8;
    }
    .login-header p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus, input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
    #tokenHelp { font-size: 13px; line-height: 1.5; color: #cbd5e1; }
    #toggleToken { width: auto; padding: 6px 10px; margin-bottom: 12px; background: transparent; color: #7dd3fc; border: 1px solid #475569; }
    .footer-note { color: #94a3b8; }
    :focus-visible { outline: 2px solid #7dd3fc; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>MAS Mission Control</h1>
      <p>Authenticate session to enter tenant workspace</p>
    </div>

    <div id="errorAlert" class="alert-error" role="alert" tabindex="-1"></div>

    <form id="loginForm" aria-busy="false">
      <div class="form-group">
        <label for="tokenInput">Access / IAM Token</label>
        <input type="password" id="tokenInput" name="token" required placeholder="Enter bearer token..." autocomplete="off" spellcheck="false" aria-describedby="tokenHelp"><p id="tokenHelp">Use an access token issued by your administrator. Your identity and permissions are checked by the server.</p><button type="button" id="toggleToken" aria-pressed="false">Show token</button>
      </div>
      <button type="submit" id="submitBtn">Sign In</button>
    </form>

    <div class="footer-note">
      Same-origin cookie authentication. Credentials are not stored in browser storage.
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const tokenInput = document.getElementById('tokenInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');

    document.getElementById('toggleToken').onclick = function () { const show = tokenInput.type === 'password'; tokenInput.type = show ? 'text' : 'password'; this.textContent = show ? 'Hide token' : 'Show token'; this.setAttribute('aria-pressed', String(show)); };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      errorAlert.textContent = '';
      form.setAttribute('aria-busy', 'true');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const token = tokenInput.value.trim();
      try {
        const resp = await fetch('/api/pm/v1/session/login', {
          method: 'POST', credentials: 'same-origin', redirect: 'error', signal: AbortSignal.timeout(15000),
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token })
        });

        const data = await resp.json();
        if (resp.ok && data.success) {
          tokenInput.value = '';
          window.location.href = '/portal/scrum.html';
        } else {
          errorAlert.textContent = (typeof data.error === 'object' ? data.error.message : data.error) || 'Authentication failed. Please check your credentials.';
          errorAlert.style.display = 'block'; errorAlert.focus();
        }
      } catch (err) {
        errorAlert.textContent = 'Network or server error while connecting to authentication authority.';
        errorAlert.style.display = 'block'; errorAlert.focus();
      } finally {
        form.setAttribute('aria-busy', 'false');
        tokenInput.type = 'password';
        document.getElementById('toggleToken').textContent = 'Show token';
        document.getElementById('toggleToken').setAttribute('aria-pressed', 'false');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
