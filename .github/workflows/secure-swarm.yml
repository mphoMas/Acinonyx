name: Supervised swarm acceptance
on:
  pull_request:
    paths: ["mas/swarm/**", "tests/test_secure_swarm.py", "pyproject.toml", "scripts/*secure_swarm.py", "templates/swarm/**", ".github/workflows/secure-swarm.yml"]
  push:
    paths: ["mas/swarm/**", "tests/test_secure_swarm.py", "pyproject.toml", "scripts/*secure_swarm.py", "templates/swarm/**", ".github/workflows/secure-swarm.yml"]
permissions:
  contents: read
jobs:
  structural-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[dev]'
      - run: docker pull python@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
      - run: python scripts/verify_secure_swarm.py --image python@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f --out /tmp/swarm-acceptance
      - run: ruff check mas/swarm tests/test_secure_swarm.py scripts/verify_secure_swarm.py scripts/evaluate_secure_swarm.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-structural-evidence
          path: /tmp/swarm-acceptance
