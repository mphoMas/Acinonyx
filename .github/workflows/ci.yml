name: CI

on:
  push:
    branches: [main, Acinonyx_frontier]
  pull_request:
    branches: [main, Acinonyx_frontier]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAS_SWARM_TEST_IMAGE: python@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps (virtual display + input)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool bubblewrap
      - name: Install package
        run: pip install -e ".[dev,browser]"
      - name: Install pinned browser and worker image
        run: |
          python -m playwright install --with-deps chromium
          docker pull "$MAS_SWARM_TEST_IMAGE"
      - name: Lint
        run: ruff check mas tests
      - name: Test with coverage
        run: pytest --cov=mas --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mas-core:ci .
      - name: Verify container runs as non-root
        run: test "$(docker run --rm --entrypoint id mas-core:ci -u)" != "0"
      - name: Verify runtime startup, auth denial and volume restart
        run: python scripts/verify_runtime_image.py --image mas-core:ci --out /tmp/runtime-image-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-image-check
          path: /tmp/runtime-image-check.json
