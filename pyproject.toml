[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-core"
version = "0.2.0"
description = "ACINONYX Multi-Agent Operating Runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Acinonyx" }]
dependencies = []

[project.optional-dependencies]
http = []
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "Pillow>=10",
]
browser = [
    "playwright==1.49.1",
]

[project.scripts]
mas = "mas.cli:main"
mas-doctor = "mas.cli:main"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.setuptools.package-data]
mas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
extend-exclude = ["gcloud auth application-default login", "node_modules", "workspace"]

[tool.coverage.run]
source = ["mas"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
