services:
  mas:
    build: .
    ports:
      - "8080:8080"
    environment:
      MAS_ENABLE_LIVE_DISPATCH: "false"
      MAS_SANDBOX_PYTHON: "true"
      MAS_TOOL_ACL: "true"
      MAS_ALLOW_MOCK_PROVIDER: "true"
    volumes:
      - ./workspace:/app/workspace
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
