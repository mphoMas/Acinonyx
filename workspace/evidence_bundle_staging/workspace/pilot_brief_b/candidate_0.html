<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinOps Multi-Tenant Cockpit - Candidate 0</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0e0d0b;
      color: #f5f2eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2b2823;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .badge { font-size: 12px; color: #8c827a; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      border: 1px solid #2b2823;
      padding: 16px;
      background: #141310;
    }
    .card-label { font-size: 11px; text-transform: uppercase; color: #8c827a; margin-bottom: 8px; }
    .card-value { font-size: 24px; font-weight: 700; }
    .card-value.alert { color: #e05a47; }
    
    /* Intentionally defective button: height 18px, text #5c544d on #0e0d0b -> 2.618:1 contrast */
    #btn-tune {
      display: inline-block;
      height: 18px;
      line-height: 18px;
      font-size: 10px;
      color: #5c544d;
      background: transparent;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      margin-right: 4px;
    }
    #link-docs {
      font-size: 10px;
      color: #8c827a;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <section id="finops-cockpit">
    <header class="header">
      <h1>FinOps Multi-Tenant Allocation</h1>
      <span class="badge" data-claim-id="CLM-01">Cap: $250,000 / mo</span>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-label">Aggregate Burn</div>
        <div class="card-value alert" data-claim-id="CLM-02">$184,210 (73.7%)</div>
      </div>
      <div class="card">
        <div class="card-label">Top Spending Service</div>
        <div class="card-value" data-claim-id="CLM-03">BigQuery Storage</div>
      </div>
      <div class="card">
        <div class="card-label">Optimization Status</div>
        <div class="card-value" style="font-size: 14px; margin-bottom: 4px;">Rebalance Recommended</div>
        <!-- Both targets adjacent: spacing < 24px, height 18px -->
        <div>
          <button id="btn-tune">Apply Rebalance</button>
          <a href="#docs" id="link-docs">View Policy</a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
