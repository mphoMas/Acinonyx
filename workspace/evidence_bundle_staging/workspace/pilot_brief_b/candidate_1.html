<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinOps Multi-Tenant Cockpit - Candidate 1 (Repaired)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0e0d0b;
      color: #f5f2eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2b2823;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .badge { font-size: 12px; color: #a89f91; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      border: 1px solid #2b2823;
      padding: 16px;
      background: #141310;
    }
    .card-label { font-size: 11px; text-transform: uppercase; color: #a89f91; margin-bottom: 8px; }
    .card-value { font-size: 24px; font-weight: 700; }
    .card-value.alert { color: #e05a47; }
    .card-value.success { color: #34d399; }
    
    /* Repaired button: height 28px >= 24px, #f5f2eb on #2b2823 -> 13.13:1 contrast */
    #btn-tune {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #f5f2eb;
      background-color: #2b2823;
      border: 1px solid #4a453d;
      border-radius: 2px;
      cursor: pointer;
      margin-top: 8px;
      margin-right: 16px;
      transition: background-color 0.15s ease;
    }
    #btn-tune:hover { background-color: #3d3831; }
    #btn-tune:focus-visible { outline: 2px solid #f5f2eb; outline-offset: 2px; }
    #btn-tune:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #link-docs {
      display: inline-block;
      min-height: 28px;
      line-height: 28px;
      font-size: 12px;
      color: #a89f91;
      text-decoration: underline;
    }
    #link-docs:hover { color: #f5f2eb; }

    .toast-status {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      background: #1c2e24;
      border: 1px solid #2d5a3f;
      color: #86efac;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <section id="finops-cockpit">
    <header class="header">
      <h1>FinOps Multi-Tenant Allocation</h1>
      <span class="badge" data-claim-id="CLM-01">Cap: $250,000 / mo</span>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-label">Aggregate Burn</div>
        <div id="burn-metric" class="card-value alert" data-claim-id="CLM-02">$184,210 (73.7%)</div>
      </div>
      <div class="card">
        <div class="card-label">Top Spending Service</div>
        <div class="card-value" data-claim-id="CLM-03">BigQuery Storage</div>
      </div>
      <div class="card">
        <div class="card-label">Optimization Status</div>
        <div id="status-label" class="card-value" style="font-size: 14px; margin-bottom: 4px;">Rebalance Recommended</div>
        <div>
          <button id="btn-tune" data-action-id="ACT-REBALANCE-01" aria-controls="burn-metric status-toast">
            Apply Rebalance
          </button>
          <a href="#docs" id="link-docs">View Policy</a>
        </div>
        <div id="status-toast" class="toast-status" role="status" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- Interactive JavaScript handling ACT-REBALANCE-01 -->
  <script>
    (function() {
      const btn = document.getElementById('btn-tune');
      const burnEl = document.getElementById('burn-metric');
      const statusLabel = document.getElementById('status-label');
      const toast = document.getElementById('status-toast');

      if (!btn) return;

      btn.addEventListener('click', function() {
        btn.disabled = true;
        btn.textContent = 'Applying...';

        // Simulate idempotent quota reclamation per ACT-REBALANCE-01
        setTimeout(function() {
          // Rebalance reclaims $15,000 idle commitments
          const newBurn = 184210 - 15000; // $169,210
          const pct = ((newBurn / 250000) * 100).toFixed(1);

          burnEl.textContent = `$${newBurn.toLocaleString()} (${pct}%)`;
          burnEl.classList.remove('alert');
          burnEl.classList.add('success');

          statusLabel.textContent = 'Optimized (Rebalanced)';
          btn.textContent = 'Rebalanced';
          btn.style.backgroundColor = '#1c2e24';
          btn.style.borderColor = '#2d5a3f';

          toast.style.display = 'block';
          toast.textContent = 'Action ACT-REBALANCE-01 confirmed: $15,000 idle commitments reclaimed, reducing current aggregate spend to $169,210.';
        }, 300);
      });
    })();
  </script>
</body>
</html>
